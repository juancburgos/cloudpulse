name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Unit tests
        working-directory: backend
        run: pytest -q

  integration:
    name: Integration (API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: cloudpulse_ci
          POSTGRES_DB: cloudpulse
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U cloudpulse -d cloudpulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cloudpulse:cloudpulse_ci@127.0.0.1:5432/cloudpulse
      APP_VERSION: ci
      REGION: ci-local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: End-to-end contract test against a real database
        working-directory: backend
        run: pytest -q tests/test_integration.py

  android:
    name: Android (assemble debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Uses the repository's Gradle wrapper, so CI runs exactly the version the project pins.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
