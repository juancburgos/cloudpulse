name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Unit tests
        working-directory: backend
        run: pytest -q

  integration:
    name: Integration (API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: cloudpulse_ci
          POSTGRES_DB: cloudpulse
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U cloudpulse -d cloudpulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cloudpulse:cloudpulse_ci@127.0.0.1:5432/cloudpulse
      APP_VERSION: ci
      REGION: ci-local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: End-to-end contract test against a real database
        working-directory: backend
        run: pytest -q tests/test_integration.py

  android:
    name: Android (assemble debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK but does not put sdkmanager on PATH, and
      # android-actions/setup-android@v3 crashes under the runner's Node 24, so we wire the
      # SDK up explicitly: locate cmdline-tools, export ANDROID_HOME and accept licenses.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_SDK_ROOT" ]; then SDK_ROOT="$ANDROID_SDK_ROOT";
          elif [ -n "$ANDROID_HOME" ]; then SDK_ROOT="$ANDROID_HOME";
          else SDK_ROOT=/usr/local/lib/android/sdk; fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            ls -la "$SDK_ROOT" >&2 || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Uses the repository's Gradle wrapper, so CI runs exactly the version the project pins.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
